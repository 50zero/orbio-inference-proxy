name: Image

on:
  push:
    branches: [main]
    tags: ["*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ghcr:
    name: Publish linux/amd64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Record git revision
        run: git rev-parse HEAD > .GIT_REV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short sha
        id: tags
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/50zero/orbio-inference-proxy:sha-${{ steps.tags.outputs.short }}
            ghcr.io/50zero/orbio-inference-proxy:latest

      - name: Job summary
        env:
          SHORT: ${{ steps.tags.outputs.short }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## orbio-inference-proxy"
            echo ""
            echo "- tags: \`sha-${SHORT}\`, \`latest\`"
            echo "- digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
